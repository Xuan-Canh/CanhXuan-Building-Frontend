<div class="service-page">
  <div class="page-header">
    <h2>🔧 Quản lý Dịch vụ</h2>
    <button class="btn-add" (click)="showCreateForm()">
      Thêm dịch vụ
    </button>
  </div>

  <!-- Main Table -->
  <div class="table-container" *ngIf="!state.showForm">
    <div class="loading" *ngIf="state.isLoading">
      Đang tải dữ liệu...
    </div>

    <div class="empty" *ngIf="!state.isLoading && services.length === 0">
      Chưa có dịch vụ nào
    </div>

    <table class="data-table" *ngIf="!state.isLoading && services.length > 0">
      <thead>
      <tr>
        <th>ID</th>
        <th>Tên dịch vụ</th>
        <th>Phí dịch vụ</th>
        <th>Mô tả</th>
        <th>Thao tác</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let service of services">
        <td>{{service.id}}</td>
        <td>{{service.name}}</td>
        <td>{{service.price | number:'1.0-0'}} đ</td>
        <td>{{service.description || '-'}}</td>
        <td>
          <div class="actions">
            <button class="btn-edit" (click)="showEditForm(service)">Sửa</button>
            <button class="btn-delete" (click)="deleteService(service.id)">Xóa</button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Form Create/Edit -->
  <div class="form-container" *ngIf="state.showForm">
    <div class="form-header">
      <h3>{{state.isEditing ? '✏️ Chỉnh sửa dịch vụ' : '➕ Thêm dịch vụ mới'}}</h3>
    </div>
    <form class="service-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Tên dịch vụ *</label>
        <input type="text" [(ngModel)]="serviceDto.name" name="name"
               placeholder="Nhập tên dịch vụ" required />
      </div>

      <div class="form-group">
        <label>Phí dịch vụ (VNĐ) *</label>
        <input type="number" [(ngModel)]="serviceDto.price" name="price"
               placeholder="Nhập phí dịch vụ" required />
      </div>

      <div class="form-group full-width">
        <label>Mô tả</label>
        <textarea [(ngModel)]="serviceDto.description" name="description"
                  placeholder="Nhập mô tả dịch vụ" rows="4"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="state.isSubmitting">
          {{state.isSubmitting ? 'Đang xử lý...' : (state.isEditing ? 'Lưu thay đổi' : 'Thêm dịch vụ')}}
        </button>
        <button type="button" class="btn-cancel" (click)="cancelForm()">Hủy</button>
      </div>
    </form>
  </div>
</div>
