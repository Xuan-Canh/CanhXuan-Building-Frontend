<div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-wrapper"></div>
      <h2>CX Apartment</h2>
      <p>Đăng nhập vào hệ thống quản lý</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Nhập tên đăng nhập"
            required
            [(ngModel)]="username"
            name="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Nhập mật khẩu"
            required
            [(ngModel)]="password"
            name="password"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="!loginForm.form.valid"
      >
        {{loginForm.form.valid ? '🚀 Đăng nhập' : '⏳ Vui lòng điền đầy đủ thông tin'}}
      </button>
    </form>

    <div class="auth-footer">
      <p>© 2025 CX Apartment Management System</p>
      <a href="#">Quên mật khẩu?</a>
    </div>
  </div>
</div>
