<header class="header">
  <div class="header-container">
    <div class="logo-section" [routerLink]="['/home']">
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="Logo">
      </div>
      <div class="brand-text">
        <h1>CX Apartment</h1>
        <p>MANAGEMENT SYSTEM</p>
      </div>
    </div>
    
    <nav class="nav-section">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         class="nav-link">
        {{ item.label }}
      </a>
    </nav>
    
    <div class="user-section">
      <ng-container *ngIf="isLogged; else notLogged">
        <div class="user-profile" (click)="toggleUserMenu()">
          <div class="avatar-wrapper">
            <img [src]="userAvatar" alt="Avatar">
          </div>
          <span class="user-name">{{ userName }}</span>
          <svg class="dropdown-icon" [class.rotated]="showUserMenu" 
               xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
               fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
          
          <!-- Dropdown Menu -->
          <div class="user-dropdown" *ngIf="showUserMenu">
            <a routerLink="/profile" class="dropdown-item" (click)="showUserMenu = false">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" 
                   fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Thông tin cá nhân</span>
            </a>
            
            <a routerLink="/change-password" class="dropdown-item" (click)="showUserMenu = false">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" 
                   fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>Đổi mật khẩu</span>
            </a>
            
            <div class="dropdown-divider"></div>
            
            <button class="dropdown-item logout" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" 
                   fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Đăng xuất</span>
            </button>
          </div>
        </div>
      </ng-container>
      
      <ng-template #notLogged>
        <a routerLink="login" class="login-button">
          Đăng nhập
        </a>
      </ng-template>
    </div>
  </div>
</header>
